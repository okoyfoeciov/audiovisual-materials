  // titlebar.js also sets this class as a fallback once window.electronWindow is certain.
  (function () {
    try {
      var p = window.electronWindow && window.electronWindow.platform;
      if (p === "darwin") document.documentElement.classList.add("is-darwin");
      else if (!p && typeof navigator !== "undefined" && /Mac/.test(navigator.platform || navigator.userAgent || "")) {
        document.documentElement.classList.add("is-darwin");
      }
    } catch {}
  })();

<!-- The floating microphone button — see mic.css/mic.js. Its own stylesheet
     (not folded into the block below) so the diff against the removal this
     app's clone once made stays a clean add, not an edit. -->
<link rel="stylesheet" href="mic.css">
<style>
  /* IPA glyphs (ə, ˈ, ˌ, ē …) render most reliably in Open Sans — used for the
     Merriam-Webster pronunciation badges in the Listen feature only. Served
     from /fonts. */
  @font-face {
    font-family: "Open Sans";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("OpenSans-400-Latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
      U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Open Sans";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("OpenSans-400-Latin-Ext.woff2") format("woff2");
    unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB,
      U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  /* Lora — the serif Substack reads in. One variable file spans the weights we
     use (400 body → 700 titles); a matching italic carries *emphasis* and
     blockquotes. Self-hosted from /fonts so it works under font-src 'self'. */
  @font-face {
    font-family: "Lora";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("Lora-Latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Lora";
    font-style: italic;
    font-weight: 400 700;
    font-display: swap;
    src: url("Lora-Latin-Italic.woff2") format("woff2");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;

    /* Substack-inspired dark theme. A warm near-black page; flat surfaces
       separated by hairlines rather than heavy drop shadows; a calm off-white
       reading colour; and Substack's signature orange as the single action
       accent. Reading surfaces (the transcript, explanations, titles)
       are set in a serif — Substack's defining move — while UI chrome
       (buttons, labels, meta) stays in a clean neutral sans. */
    --bg: #181818;
    --surface: #202020;
    --surface-2: #292826;
    --text: #e7e5e0;
    --text-2: #9b9892;
    --accent: #ff6719;
    --accent-hover: #ff8142;
    --rec: #ff5a4d;
    --hairline: rgba(255, 255, 255, 0.08);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-hover: 0 8px 26px rgba(0, 0, 0, 0.55);

    /* Listen feature */
    --border: rgba(255, 255, 255, 0.12);
    --text-soft: #c5c2bb;
    --text-dim: #78756f;
    --mark: rgba(255, 203, 92, 0.26);
    --mark-hover: rgba(255, 203, 92, 0.42);
    --word-hover: rgba(255, 255, 255, 0.07);
    /* A cool teal for pronunciation badges — a deliberate counterpoint to the
       warm orange action accent, so the two reads never get confused. */
    --pron: #8ec5d3;
    --pron-border: rgba(142, 197, 211, 0.42);
    --pron-bg: rgba(142, 197, 211, 0.1);
    --pron-fill: rgba(142, 197, 211, 0.2);
    /* A soft violet for AI-made pronunciations — when Merriam-Webster has no
       entry, the LLM supplies a best-effort respelling. A separate hue (not
       the teal MW reads as, nor the red/amber error reads) so the user can
       tell at a glance this one was generated, not looked up. */
    --pron-ai: #c3a6e8;
    --pron-ai-border: rgba(195, 166, 232, 0.5);
    --pron-ai-bg: rgba(195, 166, 232, 0.12);
    --err: #ff5a4d;
    --warn: #e8b34a;

    --serif: "Lora", Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
            "Helvetica Neue", Arial, sans-serif;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    /* Fixed-height app shell: the page itself never scrolls;
       each column and the audio bar manage their own overflow. Mobile reverts
       to a normal scrolling document (see the media query below). */
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ======================================================================
     LISTEN — movies, audio and podcasts served from this app's own local
     media-library backend, with a synced transcript + word-by-word
     explanations. The main region (the "band") holds the explanation panel and,
     until an entry is loaded, the library list; the rolling 3-sentence transcript
     window and a full-width bar at the page bottom make up the player.
     (Inner class names are kept verbatim to match the Listen JS below.)
     ====================================================================== */

  /* Explanation band — the page's main region, filling the whole area above the
     player. Holds the single explanation panel (R1), anchored to the bottom
     (nearest the caption) at a draggable height; the space above it is empty. */
  .explain-band {
    flex: 1 1 auto;                /* the main region: fills the area above the player */
    min-height: 0;
    overflow: visible;             /* don't clip the floating record button / its shadow */
    display: flex;
    flex-direction: column;        /* panels reordered via `order` (R1 bottom) */
    justify-content: flex-end;     /* the panel sits at the bottom, R1 nearest caption */
    position: relative;
    /* Clearance for the record button, which is fixed at the top-right and so sits
       outside the flow: without this the band's content renders under the mic
       glyph — and, at narrow widths, becomes unclickable. */
    padding-top: 52px;
    background: color-mix(in srgb, var(--bg) 55%, var(--surface));
  }
  .explain-band[hidden] { display: none; }

  /* The single explanation panel (R1). Anchored to the bottom of the band
     (nearest the caption) at a draggable height (--panel-h); the space above is
     empty. It scrolls its own text rather than growing to fit content. */
  .explain-panel {
    flex: 0 0 var(--panel-h, 60vh);
    min-height: 0;
    position: relative;            /* anchor for the top-edge resize handle */
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }

  /* Resize handle on the panel's top edge — drag up/down to change its height.
     Invisible at rest, a faint accent line on hover/drag. */
  .panel-resize {
    position: absolute;
    left: 0;
    right: 0;
    top: -5px;
    height: 11px;
    cursor: row-resize;
    z-index: 6;
    touch-action: none;
  }
  .panel-resize::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.13s ease;
  }
  .panel-resize:hover::after,
  .panel-resize.dragging::after { opacity: 0.55; }

  /* Centered loading spinner overlay (shown while a transcript loads). */
  .band-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .band-loading[hidden] { display: none; }
  /* While dragging, suppress text selection + pointer noise. */
  body.resizing { cursor: row-resize; user-select: none; -webkit-user-select: none; }

  /* Library grid (the "home page") — fills the same region a video would
     (order:-1, flex:1 1 auto), shown while nothing is loaded. A responsive
     poster grid, one .lib-card per entry (see .lib-card below). */
  .library-view {
    position: relative;
    order: -1;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 28px 20px;
    align-content: start;
  }
  .library-view[hidden] { display: none; }
  .library-view .window-status { grid-column: 1 / -1; }

  /* One card: cover, title, kind, continue-watching line. Bare button, no
     surface — the cover art itself is the only "chrome". */
  .lib-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    padding: 0;
    background: none;
    border: 0;
    text-align: left;
    cursor: pointer;
    font-family: var(--sans);
  }
  .lib-card:focus-visible { outline: none; }
  .lib-card:focus-visible .lib-thumb { outline: 2px solid var(--accent); outline-offset: 3px; }
  .lib-card-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .lib-card-kind { font-size: 12.5px; color: var(--text-2); }
  .lib-card-progress { font-size: 11.5px; color: var(--text-dim); }

  /* Cover art for a grid card. A gradient+icon fallback always sits
     underneath; the <img> just covers it when a poster.jpg exists (see
     backend/poster.js) and stays hidden (onerror) when it 404s, which is the
     common case for anything without cover art. */
  .lib-thumb {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface-2);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .lib-card:hover .lib-thumb { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .lib-thumb img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
  .lib-thumb-fallback {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, hsl(var(--hue, 30) 35% 24%), hsl(calc(var(--hue, 30) + 35) 35% 12%));
  }
  .lib-thumb-fallback svg { width: 34%; height: 34%; color: rgba(255, 255, 255, 0.85); }

  /* Back button for a nested view (a collection's children — e.g. the days
     within a show, or the segments within a day). Absolutely positioned
     within .library-view's own top/left padding, rather than a grid row of
     its own — a grid row would push every card down when the button
     appears, so the first card would sit lower on a nested page than on
     the root grid. This way the grid layout is identical whether the
     button is there or not; it just floats in space the padding already
     reserves. */
  .lib-list-back {
    position: absolute;
    top: 10px;
    left: 32px;
    margin: 0;
    padding: 0;
    background: none;
    border: 0;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text-2);
  }
  .lib-list-back:hover { color: var(--text); }

  /* ---------- video stage (any hasVideo library entry · desktop only) ----------
     Fills the main region ABOVE the explanation panel while a video is shown
     (order:-1, flex:1 1 auto). Letterboxed on pure black — not the warm page
     background — since that is what reads as "picture" behind a frame that
     can't fill the box; object-fit keeps the frame whole at any panel height. */
  .video-window {
    order: -1;
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }
  .video-window[hidden] { display: none; }
  /* Deliberately NO `controls`: the page's player bar is the only transport, and
     the picture is muted and slaved to it (native controls would let the two
     drift apart). Clicking the picture toggles play/pause — the one gesture a
     video invites — hence the pointer cursor. */
  .video-window video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    cursor: pointer;
  }
  /* Belt and braces on the focus ring (see the element's comment): the picture is
     a display surface, not a control — it is not in the tab order and every real
     control keeps its ring, so there is no keyboard affordance to lose here. */
  .video-window video:focus,
  .video-window video:focus-visible { outline: none; }
  /* In video mode the picture takes the WHOLE top of the page, so the band drops
     its record-button clearance and the frame starts at y=0. Nothing is lost: the
     button is fixed, so it keeps floating over the picture (drop-shadow above). */
  body.video-on .explain-band { padding-top: 0; }

  /* "Preparing…" / error overlay. Opaque, so a stale frame can never sit behind a
     message about a picture that isn't there. */
  .video-status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
  }
  .video-status[hidden] { display: none; }

  /* Caption — the line being spoken, sitting at the top of the player like a
     video's subtitles. Lives inside the .player block; centred, grows with the
     line, and only scrolls if a sentence is unusually long. */
  .now-window {
    /* min-height = one caption line, so the box is the SAME height whether it
       holds the loading spinner, a freshly-revealed first word, or a full line.
       That kills the height jump when the transcript finishes loading. */
    min-height: 40px;
    max-height: 26vh;
    overflow-y: auto;
    /* Negative margin cancels most of the player's side gutter so a long line
       runs nearly edge-to-edge. */
    margin: 0 -14px;
    padding: 2px 0 9px;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;   /* no iOS long-press callout — the hold is ours */
  }
  .now-window:empty { display: none; }
  .chunk { font-family: var(--serif); line-height: 1.55; letter-spacing: 0; transition: color 0.3s ease; }
  .chunk.current { font-size: 17px; font-weight: 600; color: var(--text); }
  /* The preceding line, shown above the current one as a dimmed, already-spoken
     subtitle. Dimmer than the current line but fully interactive — its words are
     markable just like the current line's. Dim via COLOR (not opacity) so a
     marked word can still light up to full brightness — a parent opacity would
     cap its children and mute the mark. */
  .chunk.context { font-size: 15px; font-weight: 400; color: var(--text-dim); margin: 0 0 2px; }

  .word {
    cursor: pointer;
    padding: 1px 2px;
    margin: 0 -2px;
    border-radius: 4px;
    transition: background 0.12s ease;
  }
  .word:hover { background: var(--word-hover); }
  .word.marked, .word.marked:hover { background: var(--mark); color: var(--text); }
  .word.marked:hover { background: var(--mark-hover); }
  /* Words in the active A-B loop — set by right-clicking a word or right-dragging a
     phrase; playback repeats over them until cleared (right-click again / Esc). A
     soft accent tint plus the accent underline marks the looped span. (color-mix
     may be unsupported on old engines — the underline alone still reads as the mark.) */
  .word.looping {
    box-shadow: inset 0 -2px 0 0 var(--accent);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-radius: 4px 4px 0 0;
  }

  /* Word-by-word reveal (karaoke). When the transcript carries per-word
     timings, the caption gets the .reveal class: a word is not rendered at all
     until it has been spoken (so the line grows as the speaker talks and there
     are no blank gaps), then it appears. The word currently being spoken glows
     in the accent colour. */
  /* Reveal mode is LEFT-aligned: already-spoken words stay anchored on the left
     while new ones extend to the right, so the eye never has to chase a moving
     line (centred reveal re-centres on every word). The side padding restores
     the player's gutter that the negative margin cancels. */
  .now-window.reveal { text-align: left; padding-left: 14px; padding-right: 14px; }
  .now-window.reveal .word { display: none; }
  .now-window.reveal .word.spoken { display: inline; }
  /* Keep looped words visible even if the reveal would hide them (e.g. after the
     loop seeks back before them), so the loop marker never disappears while its
     line is on screen. */
  .now-window.reveal .word.looping { display: inline; }
  /* The word being spoken is NOT colour-highlighted — words just appear in the
     normal text colour as they're read (the .speaking class is still applied,
     left unstyled in case we want to bring a highlight back later). */

  .window-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    /* NO vertical padding: the spinner (22px) + the caption's own padding stays
       under .now-window's 40px min-height, so the loading state and a one-line
       caption are the exact same height — the bar no longer drops on load. */
    padding: 0 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
  }
  /* An error status (a failed transcript) reads in the warning colour, not the
     calm dim grey of a neutral/loading status. */
  .window-status.error { color: var(--err); }
  .spinner {
    width: 22px; height: 22px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .explain-content {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    overflow-y: auto;
    /* Keep a scroll gesture that started in the panel inside the panel: don't let
       it chain to the page (the article behind it) when it hits the top/bottom. */
    overscroll-behavior: contain;
    padding: 20px 16px;
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--text);
  }
  .now-window::-webkit-scrollbar,
  .explain-content::-webkit-scrollbar { width: 10px; }
  .now-window::-webkit-scrollbar-thumb,
  .explain-content::-webkit-scrollbar-thumb {
    background: var(--border);
    background-clip: padding-box;
    border: 3px solid transparent;
    border-radius: 999px;
  }
  .explain-content .round p { margin: 0 0 10px; }
  .explain-content .round p:last-child { margin-bottom: 0; }
  .explain-content strong { font-weight: 600; color: var(--text); }
  .explain-content em { color: var(--text-soft); font-style: italic; }
  .explain-content blockquote {
    margin: 4px 0 10px;
    padding: 2px 0 2px 14px;
    border-left: 2px solid var(--border);
    color: var(--text-soft);
    font-size: 0.95em;
  }
  .explain-content blockquote strong { color: var(--text); }
  .explain-content .err { color: var(--err); font-weight: 500; }

  .response-word { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .round-block.divided {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .pron-only {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 14px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .pron-only-row { display: inline-flex; align-items: center; gap: 6px; }
  .pron-only-row strong { font-weight: 600; color: var(--text); }

  /* Likelihood chip — how much of the probability mass one reading carries,
     shown only when the passage genuinely leaves the sense open and the answer
     therefore gives more than one. Deliberately NEUTRAL grey, not a new hue:
     teal already reads "from the dictionary", violet "AI-made" and orange
     "action", so a fourth colour here would look like a fourth category of
     thing rather than what it is — metadata about the sense beside it. The
     leading reading takes .lead and sits brighter, so the eye lands on the most
     likely meaning first and the alternates recede. */
  .sense-odds {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0 7px;
    margin: 0 5px 0 6px;
    font-family: var(--sans);
    font-size: 0.7em;
    font-style: normal;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.9;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    vertical-align: baseline;
    cursor: help;
    white-space: nowrap;
  }
  .sense-odds.lead {
    color: var(--text-soft);
    border-color: var(--text-dim);
  }

  .pron-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    color: var(--pron);
    border: 1px solid var(--pron-border);
    border-radius: 100px;
    padding: 0 8px 0 10px;
    font: inherit;
    font-size: 0.9em;
    line-height: 1.7;
    cursor: pointer;
    vertical-align: baseline;
    margin: 0 2px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pron-badge:hover { background: var(--pron-bg); }
  .pron-badge:focus-visible { outline: 2px solid var(--pron); outline-offset: 2px; }
  .pron-badge.is-playing { background: var(--pron-bg); }
  .pron-badge.loading { opacity: 0.55; cursor: progress; }
  .pron-badge.failed { border-style: dashed; cursor: help; }
  /* MW refused the request (the Cloudflare 403, a 5xx, or a network blip):
     a loud red error state — never the bare word. */
  .pron-badge.failed.err-mw { color: var(--err); border-color: rgba(255, 90, 77, 0.55); }
  .pron-badge.failed.err-mw:hover { background: rgba(255, 90, 77, 0.1); }
  /* MW answered but has no pronunciation for this word: a softer amber. */
  .pron-badge.failed.err-none { color: var(--warn); border-color: rgba(232, 179, 74, 0.55); }
  .pron-badge.failed.err-none:hover { background: rgba(232, 179, 74, 0.1); }
  .pron-badge .warn { width: 12px; height: 12px; fill: currentColor; }
  .pron-badge .err-label { font-style: normal; font-size: 0.9em; }
  /* AI-made pronunciation: Merriam-Webster had no entry, so the badge shows the
     LLM's best-effort respelling. Marked distinctly — violet, dashed, a leading
     "≈" and a trailing "AI" tag — so it never reads as a real dictionary
     pronunciation. Not playable (there is no recording), hence cursor: help. */
  .pron-badge.ai-made {
    color: var(--pron-ai);
    border-color: var(--pron-ai-border);
    border-style: dashed;
    cursor: help;
  }
  .pron-badge.ai-made:hover { background: var(--pron-ai-bg); }
  .pron-badge.ai-made .approx { font-style: normal; opacity: 0.8; margin-right: -1px; }
  .pron-badge.ai-made .ai-tag {
    font-style: normal;
    font-size: 0.62em;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 1px 4px;
    margin-left: 2px;
    border-radius: 4px;
    background: var(--pron-ai-bg);
    color: var(--pron-ai);
  }
  .pron-badge .ipa { font-style: normal; font-family: "Open Sans", inherit; }
  .pron-badge .speaker { width: 12px; height: 12px; fill: currentColor; margin-left: 1px; }
  .pron-badge .badge-pos { font-style: italic; font-size: 0.85em; color: var(--text-soft); margin-right: 1px; }
  .pron-badge .dot-loader { display: inline-block; width: 16px; text-align: center; letter-spacing: 1px; }
  .pron-variants { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .pron-badge.is-picked {
    border-color: var(--pron);
    background: var(--pron-fill);
    box-shadow: 0 0 0 1px var(--pron) inset;
  }
  .pron-badge.is-picked:hover { background: var(--pron-fill); }
  .pron-badge.is-picked .badge-pos { color: var(--pron); font-style: normal; font-weight: 700; }
  .pron-badge.is-picked .ipa { font-weight: 600; }
  .pron-variants:has(.is-picked) .pron-badge:not(.is-picked) { opacity: 0.45; }
  .pron-variants:has(.is-picked) .pron-badge:not(.is-picked):hover { opacity: 1; }

  .thinking { display: inline-flex; align-items: center; gap: 6px; padding: 8px 2px; }
  .thinking span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: thinking-pulse 1.4s ease infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.18s; }
  .thinking span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes thinking-pulse {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40% { opacity: 0.95; transform: translateY(-3px); }
  }

  /* ---------- bottom player block (full width) ---------- */
  /* Holds the synced caption (.now-window), an optional low-credit warning, and
     the controls row (library · play · seek). It is the bottom flex child of
     the body shell. */
  .player {
    position: relative;
    flex: 0 0 auto;
    padding: 7px 16px 8px;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
  }
  .player[hidden] { display: none; }

  /* Holds only the low-credit warning (when present), on its own line above the
     controls. Collapses to zero height when the warning is hidden — the file's
     name lives in the browser tab title. */
  .ab-titlebar { display: flex; align-items: baseline; gap: 12px; padding: 0 2px; }
  .ab-warn { font-size: 11.5px; font-weight: 500; color: var(--rec); white-space: nowrap; margin-bottom: 5px; }
  .ab-warn[hidden] { display: none; }

  /* touch-action: manipulation across the bar (and the seek track below) so a fast
     double-tap anywhere in the transport area — not just on the buttons — never
     triggers mobile double-tap-to-zoom. */
  .audiobar { position: relative; display: flex; align-items: center; gap: 13px; touch-action: manipulation; }
  /* No circle, no surface: the button IS just its icon, matching the floating
     record / import buttons. The 34px box stays as an invisible touch target. */
  .ab-menu, .ab-play, .ab-skip, .ab-collapse {
    flex: none;
    width: 34px; height: 34px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    /* Tapping the jump buttons fast must not trigger the browser's double-tap
       zoom (mobile). Same touch hygiene the record button uses. */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
  }
  /* Keyboard focus ring — there's no border/surface now, so the bare icon needs
     an outline to show focus. Matches the .pron-badge / record-button pattern. */
  .ab-menu:focus-visible, .ab-skip:focus-visible,
  .ab-collapse:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* Play never gets one — not the accent ring above, not the browser's own
     default outline either. setSource() parks focus here on every load (so
     Space is useful right away), and that shouldn't draw a ring around a
     button nobody tabbed to. */
  .ab-play:focus-visible { outline: none; }
  .ab-menu { color: var(--text-soft); }
  .ab-menu:hover { color: var(--text); }
  .ab-menu svg { width: 20px; height: 20px; display: block; }
  .ab-play { color: var(--accent); }
  .ab-play:active, .ab-menu:active { transform: scale(0.94); }
  .ab-play:disabled { opacity: 0.4; cursor: default; }
  .ab-play svg { width: 20px; height: 20px; display: block; }
  /* Default state shows play, hides pause. The selector must out-specify
     `.ab-play svg { display: block }` above, hence `.ab-play .ab-ico-*`. */
  .ab-play .ab-ico-pause { display: none; }
  .audiobar.playing .ab-play .ab-ico-play { display: none; }
  .audiobar.playing .ab-play .ab-ico-pause { display: block; }
  /* ← / → jump buttons. Hidden on desktop, where the arrow keys already do this;
     revealed on mobile by the media query (which also wraps the bar so the seek
     track gets its own full-width row). */
  .ab-skip { display: none; color: var(--text-soft); }
  .ab-skip:hover { color: var(--text); }
  .ab-skip:active { transform: scale(0.94); }
  .ab-skip:disabled { opacity: 0.4; cursor: default; }
  .ab-skip svg { width: 20px; height: 20px; display: block; }
  /* Collapse the player (mobile only). A chevron-down that sits at the far right
     of the controls row and hides the whole player; the floating broadcast
     button (.ln-fab) then brings it back. Hidden on desktop (revealed by the
     mobile media query, which also pushes it to the row's right edge). */
  .ab-collapse { display: none; color: var(--text-soft); }
  .ab-collapse:hover { color: var(--text); }
  .ab-collapse:active { transform: scale(0.94); }
  .ab-collapse svg { width: 20px; height: 20px; display: block; }

  /* Floating "show player" button (mobile only). When the player is collapsed,
     this broadcast glyph floats at the bottom-right corner — same bare-glyph
     style as the record button (.ex-btn): no surface, just the icon. Hidden by
     default; the mobile media query reveals it only while collapsed. */
  .ln-fab {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom));
    right: 14px;
    z-index: 55;                 /* above the band/panel; below the record button (60) */
    display: none;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border: 0;
    background: none;
    color: var(--text-soft);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    transition: transform .16s ease, color .16s ease;
  }
  .ln-fab:active { transform: scale(0.9); }
  .ln-fab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ln-fab svg { width: 24px; height: 24px; display: block; }
  @media (hover: hover) { .ln-fab:hover { color: var(--text); } }
  /* Seek track + time as one flex unit. min-width:0 lets the track shrink inside
     it; on desktop this lays out identically to the old flat row. */
  .ab-progress { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 13px; touch-action: manipulation; }
  .ab-track {
    flex: 1 1 auto;
    height: 6px;
    border-radius: 3px;
    background: var(--hairline);
    cursor: pointer;
    overflow: hidden;
    touch-action: manipulation;   /* click-to-seek only; no double-tap zoom */
  }
  .ab-fill { height: 100%; width: 0; background: var(--accent); }
  .ab-time {
    flex: none;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-2);
    min-width: 84px;
    text-align: right;
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner, .thinking span { animation: none; }
  }

  /* Stacked single-column layout on narrow screens. */
  @media (max-width: 760px) {
    /* Mobile reverts to a normal scrolling document; the player floats fixed at
       the bottom and the band fills the screen above it. */
    body { height: auto; min-height: 100dvh; overflow: visible; display: block; }

    /* The band is the page's main content: fill the screen above the fixed
       player and clear it with a matching bottom margin. Panels flow and the
       page itself scrolls (no internal band scroll on mobile). */
    .explain-band {
      /* Reserve the player's REAL height (set from JS as --player-h, which
         already includes the safe-area padding) so the fixed player never floats
         up over the band — mirroring desktop, where the player is in normal flow
         and simply pushes the band up. The fallback covers the first paint,
         before the script measures the player. */
      min-height: calc(100dvh - var(--player-h, 130px));
      overflow: visible;
      margin-bottom: var(--player-h, 130px);
    }
    /* The panel keeps the SAME draggable height as desktop (var(--panel-h)) —
       anchored at the bottom near the player with empty space above, NOT filling
       the whole band. (Dropping the desktop `flex: 0 0 var(--panel-h)` is why we
       used to fill; we now inherit it.) Resize via the handle below. */
    /* FLOAT the panel, like desktop. On desktop the page never scrolls and the
       panel is a fixed-height box pinned to the bottom while the text scrolls in
       its own box above. On mobile the whole page scrolls, so without help the
       panel would scroll away with the text and a long article reading above an
       explanation would hide it. position:sticky pins the panel just above the
       fixed player (bottom = its reserved height) so it stays on screen while the
       original text scrolls underneath — and, because it stays in normal flow, it
       keeps reserving its own height at the end of the band (so the last lines of
       text always clear it) and simply isn't there when no explanation exists yet.
       An opaque background (matching the band) is required since text scrolls
       beneath it; z-index sits above the text but below the fixed player (20) and
       the record button (60). The top-edge resize handle rides along, so the panel
       is still draggable while floating. */
    .explain-panel {
      position: sticky;
      bottom: var(--player-h, 130px);
      z-index: 10;
      background: color-mix(in srgb, var(--bg) 55%, var(--surface));
    }
    /* Show the resize handle on touch: no hover to reveal it, so give it a
       persistent centered grabber and a taller, easier-to-grab hit area. */
    .panel-resize { top: -10px; height: 22px; }
    .panel-resize::after {
      opacity: 0.5;
      left: 50%; right: auto;
      width: 40px; height: 4px;
      border-radius: 2px;
      transform: translate(-50%, -50%);
    }
    /* Video mode is desktop-only (the toggle isn't even reachable here) — but if a
       desktop window is dragged narrow while it's on, the stage goes away instantly
       rather than squeezing the panel + player off the screen. The JS also releases
       the video on that same breakpoint crossing, so nothing keeps decoding behind
       a display:none. */
    .video-window { display: none; }
    .player {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 20;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    }

    /* Touch devices have no arrow keys, so reveal the ← / → jump buttons and let
       the bar wrap: transport controls (add · back · play · forward) on the top
       row, the seek track + time on their own full-width row below — the standard
       mobile player shape, and it keeps the seek bar wide enough to scrub. */
    .ab-skip { display: flex; }
    /* Spread all five controls evenly across the row: space-between puts
       add-audio at the left endpoint and hide at the right endpoint, with
       back · play · forward evenly distributed between them. The seek row below
       is flex-basis:100% so it sits alone on its own line, unaffected. */
    .audiobar { flex-wrap: wrap; row-gap: 12px; justify-content: space-between; }
    .ab-progress { flex-basis: 100%; }

    /* The three transport buttons (back · play/pause · forward) share one size,
       bigger than the two side buttons (add · hide, which stay 34px / 20px). Bare
       glyphs, so the icon size IS the visible size — and the play glyph now fills
       its box like the jump icons, so equal px reads as equal visual size. Even
       spacing across the row is handled by .audiobar's space-between above. */
    #ln-back, #ln-play, #ln-fwd { width: 44px; height: 44px; }
    #ln-back svg, #ln-play svg, #ln-fwd svg { width: 30px; height: 30px; }
    /* Un-dimmed (NOT bold): each button keeps its own colour, just at full
       strength — back/forward go from the dimmed --text-soft to --text; play
       keeps its accent orange. So the trio reads brighter than the two still-dim
       side buttons (add · hide). */
    #ln-back, #ln-fwd { color: var(--text); }

    /* The record button is pinned to the viewport's top-right (see the base .ex
       rule); on mobile, nudge it clear of the status-bar / notch safe area. */
    .ex { top: calc(16px + env(safe-area-inset-top)); right: 14px; }

    /* ---- Collapsible player (mobile only) ----
       The whole player starts collapsed (body.player-collapsed in the markup):
       hide it and float the broadcast button (.ln-fab) bottom-right to bring it
       back. Tapping the chevron (.ab-collapse) inside the controls re-adds the
       class. On desktop none of this applies — the class is a no-op there.
       (No margin needed — .audiobar's space-between lands this button at the
       row's right endpoint.) */
    .ab-collapse { display: flex; }
    body.player-collapsed .player { display: none; }
    body.player-collapsed .ln-fab { display: flex; }
  }

  /* ======================================================================
     Custom title bar — all platforms (see titlebar.js). Frameless window
     with the same right-aligned min/max/close as Linux — previously
     Linux/Windows only, now macOS too (no more hiddenInset traffic lights).
     Kept visually as quiet as possible: no separate surface colour, just a
     hairline to close off the content below.
     ====================================================================== */
  .electron-titlebar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    height: 38px;
    background: var(--bg);
    border-bottom: 1px solid var(--hairline);
    -webkit-app-region: drag;
    -webkit-user-select: none;
    user-select: none;
  }
  .electron-titlebar[hidden] { display: none; }
  .electron-titlebar-controls {
    margin-left: auto;
    display: flex;
    align-self: stretch;
    -webkit-app-region: no-drag;
  }
  .electron-titlebar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    background: transparent;
    border: none;
    padding: 0;
    color: var(--text-2);
    cursor: default;
  }
  .electron-titlebar-btn:hover { background: var(--word-hover); color: var(--text); }
  .electron-titlebar-btn-close:hover { background: var(--err); color: #fff; }
  .electron-titlebar-btn svg { width: 10px; height: 10px; }
  .electron-titlebar-btn .icon-restore { display: none; }
  .electron-titlebar-btn-max.is-maximized .icon-maximize { display: none; }
  .electron-titlebar-btn-max.is-maximized .icon-restore { display: block; }

  /* ======================================================================
     Feature tabs — Watch vs Daily Dictation. Floats in the empty space
     above the library/video/dictation main area, so it never pushes the
     film panels down (the user has "lots of space up there"). */
  .feature-tabs {
    position: absolute;
    top: 10px;
    left: 32px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
    /* no border/background — sits on the band's own background */
  }
  .feature-tab {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text-2);
    background: var(--surface);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .feature-tab:hover { color: var(--text); border-color: var(--border); }
  .feature-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .feature-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Tabs and the nested-view back button both float at 10,32 — without help
     they sit on top of each other. When the back button is present, slide it
     to the right of the tabs so both stay legible. Applies to all platforms
     now that macOS uses the same frameless custom title bar as Linux. */
  .explain-band:has(.lib-list-back) .lib-list-back {
    left: 250px;
  }

  /* ======================================================================
     Dictation — audio-only notepad that replaces the video stage.
     Same order/flex as .library-view / .video-window so they are
     mutually exclusive full-bleed panels inside .explain-band. */
  .dictation-view {
    order: -1;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .dictation-view[hidden] { display: none; }
  .dictation-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  #dictation-next { margin-left: auto; }
  .dictation-stats {
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--text-2);
  }
  .dictation-session-meta {
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .dictation-title {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 520px;
  }
  .dictation-loop-hint {
    font-family: var(--sans);
    font-size: 11.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dictation-loop-hint .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    animation: dict-pulse 1.2s ease infinite;
  }
  @keyframes dict-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .dictation-notepad-wrap {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .dictation-textarea {
    width: 100%;
    min-height: 140px;
    max-height: 42vh;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--serif);
    font-size: 16.5px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .dictation-textarea::placeholder { color: var(--text-dim); }
  .dictation-textarea:focus { border-color: rgba(255,103,25,0.45); box-shadow: 0 0 0 3px rgba(255,103,25,0.16); }
  .dictation-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .dictation-btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 8px 16px;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease, transform 0.12s ease;
  }
  .dictation-btn:active { transform: scale(0.97); }
  .dictation-btn:disabled { opacity: 0.45; cursor: default; transform: none; }
  .dictation-btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .dictation-btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .dictation-btn.ghost {
    background: var(--surface);
    color: var(--text-soft);
    border-color: var(--border);
  }
  .dictation-btn.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }
  .dictation-score {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .dictation-score .pct {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    padding: 4px 10px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .dictation-score .pct.good { color: #34c759; border-color: rgba(52,199,89,0.35); }
  .dictation-score .pct.mid { color: #e8b34a; border-color: rgba(232,179,74,0.35); }
  .dictation-score .pct.bad { color: var(--err); border-color: rgba(255,90,77,0.35); }
  .dictation-score .detail { font-weight: 500; font-size: 12.5px; color: var(--text-2); }
  .dictation-result {
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-soft);
  }
  .dictation-result[hidden] { display: none; }
  .dictation-result .word {
    padding: 1px 3px;
    margin: 0 -1px;
    border-radius: 5px;
  }
  .dictation-result .word.correct { background: rgba(52,199,89,0.16); color: var(--text); }
  .dictation-result .word.sub { background: rgba(255,90,77,0.18); color: var(--text); text-decoration: line-through; text-decoration-color: rgba(255,90,77,0.8); }
  .dictation-result .word.ins { background: rgba(255,90,77,0.12); color: var(--err); font-style: italic; }
  .dictation-result .word.missing { background: rgba(232,179,74,0.20); color: var(--text); border: 1px dashed rgba(232,179,74,0.5); }
  .dictation-ref {
    padding: 12px 14px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--surface) 88%, var(--bg));
    border: 1px solid var(--border);
    font-family: var(--serif);
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text-soft);
  }
  .dictation-ref[hidden] { display: none; }
  .dictation-ref strong { color: var(--text); }
  .dictation-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-2);
    font-family: var(--sans);
    font-size: 14px;
  }
  .dictation-empty p { margin: 0 0 12px; }
  /* In dictation mode the video stage is never shown, even if the entry
     has hasVideo — audio-only by spec. */
  body.dictation-on .video-window { display: none !important; }
  /* When dictation is active, the library grid is hidden — the dictation
     view owns the main region. */
  body.dictation-on .library-view { display: none !important; }
  @media (max-width: 760px) {
    .feature-tabs { left: 16px; top: calc(10px + env(safe-area-inset-top)); }
    .dictation-view { padding-left: 16px; padding-right: 16px; }
    .dictation-textarea { font-size: 16px; min-height: 120px; }
    .explain-band:has(.lib-list-back) .lib-list-back { left: 180px; }
  }
</style>
</head>
<body class="player-collapsed">
  <!-- Custom title bar — all platforms (frameless). Shown and wired up by
       titlebar.js — previously Linux/Windows only, now macOS too (no more
       native traffic lights). -->
  <div class="electron-titlebar" id="electron-titlebar" hidden>
    <div class="electron-titlebar-controls">
      <button class="electron-titlebar-btn" id="electron-titlebar-min" type="button" aria-label="Minimize">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><line x1="1" y1="5" x2="9" y2="5"/></svg>
      </button>
      <button class="electron-titlebar-btn electron-titlebar-btn-max" id="electron-titlebar-max" type="button" aria-label="Maximize">
        <svg class="icon-maximize" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="1" y="1" width="8" height="8"/></svg>
        <svg class="icon-restore" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="1" y="2.5" width="6.5" height="6.5"/><path d="M3.5 2.5V1H9v6.5H7.5"/></svg>
      </button>
      <button class="electron-titlebar-btn electron-titlebar-btn-close" id="electron-titlebar-close" type="button" aria-label="Close">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
      </button>
    </div>
  </div>

  <!-- Explanation band — the page's main region. Fills the whole area above the
       player and holds the single explanation panel (R1, injected at runtime,
       see makePanel), anchored to the bottom at a draggable height. -->
  <div class="explain-band" id="ln-explain-band">
    <!-- Feature tabs — Watch (library + transcript) vs Daily Dictation
         (audio-only notepad, 1–2 sentences per session). Visible in both idle
         and active states; the active feature owns the main region above the
         player. -->
    <div class="feature-tabs" id="ln-tabs" role="tablist" aria-label="Features">
      <button class="feature-tab active" id="tab-watch" type="button" role="tab" aria-selected="true" data-feature="watch">Watch</button>
      <button class="feature-tab" id="tab-dictation" type="button" role="tab" aria-selected="false" data-feature="dictation">Daily Dictation</button>
    </div>

    <!-- Loading spinner shown while a library entry's transcript is being
         generated — no text, just the animation. -->
    <div class="band-loading" id="ln-band-loading" hidden aria-label="Loading"><div class="spinner"></div></div>

    <!-- Library list — shown when nothing is loaded (setListen("idle")) and
         populated from GET /api/library; each row funnels into setSource(). -->
    <div class="library-view" id="ln-library-view" hidden></div>

    <!-- Dictation — audio-only notepad (replaces video in this feature).
         The whole PBS NewsHour segment is streamed but the player loops only
         on the active 1–2 sentence session (see app-dictation.js). -->
    <div class="dictation-view" id="dictation-view" hidden>
      <div class="dictation-topbar">
        <span class="dictation-stats" id="dictation-stats" hidden></span>
        <button class="dictation-btn ghost" id="dictation-next" type="button" title="Next session (mark current as done)">Next →</button>
      </div>
      <div class="dictation-session-meta" id="dictation-session-meta" hidden>
        <span class="dictation-title" id="dictation-title"></span>
        <span class="dictation-loop-hint" id="dictation-loop-hint" hidden><span id="dictation-loop-range"></span></span>
      </div>
      <div class="dictation-notepad-wrap" id="dictation-notepad-wrap" hidden>
        <textarea class="dictation-textarea" id="dictation-input" placeholder="Type what you hear…" rows="6" spellcheck="false" autocomplete="off"></textarea>
        <div class="dictation-actions">
          <button class="dictation-btn primary" id="dictation-check" type="button">Check</button>
          <button class="dictation-btn ghost" id="dictation-reveal" type="button" hidden>Reveal transcript</button>
          <button class="dictation-btn ghost" id="dictation-replay" type="button" title="Replay loop from start">Replay</button>
          <span class="dictation-score" id="dictation-score" hidden>
            <span class="pct" id="dictation-pct">—</span>
            <span class="detail" id="dictation-detail"></span>
          </span>
        </div>
        <div class="dictation-result" id="dictation-result" hidden></div>
        <div class="dictation-ref" id="dictation-ref" hidden></div>
      </div>
      <div class="dictation-empty" id="dictation-empty" hidden>
        <p id="dictation-empty-msg">No dictation sessions available.</p>
        <button class="dictation-btn primary" id="dictation-retry" type="button">Retry</button>
      </div>
    </div>

    <!-- Video stage — any library entry with hasVideo, desktop only. The
         <video> is MUTED and slaved to #ln-audio (the clock the transcript is
         aligned to), holds no blob — its src is a plain URL the browser
         Range-streams — and has that src removed the moment video mode goes
         off, so nothing accumulates across a session. -->
    <div class="video-window" id="ln-video" hidden aria-label="Video">
      <!-- No tabindex on purpose: a <video> without `controls` isn't focusable,
           and tabindex="-1" would make it CLICK-focusable — which is what put
           Chrome's focus ring (white on a dark theme) around the picture the
           moment an arrow key switched it to keyboard modality. -->
      <video id="ln-video-el" muted playsinline webkit-playsinline preload="auto"
             disablepictureinpicture></video>
      <div class="video-status" id="ln-video-status" hidden></div>
    </div>

  </div>

  <!-- Full-width player block, pinned to the page bottom: the current-line
       caption (subtitles) on top, then the controls row (library button ·
       play · seek). The entry's title lives in the browser tab title. A low-credit
       warning, when present, shows just above the controls. -->
  <div class="player" id="ln-player" hidden>
    <!-- Caption: the current line plus the preceding line (dimmed). Both are
         markable; the LLM receives a 3-line window (those two plus the next
         line). -->
    <div class="now-window" id="ln-now" aria-live="polite"></div>
    <div class="ab-titlebar">
      <span class="ab-warn" id="ln-warn" hidden></span>
    </div>
    <div class="audiobar" id="ln-bar">
      <!-- Library. Returns to the home grid (goHome()) — stops whatever's
           loaded and shows every entry the backend has; re-picking one
           resumes from its saved position. -->
      <button class="ab-menu" id="ln-open" type="button" aria-label="Library" title="Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      </button>
      <!-- Jump back 5s. Mirrors the ← arrow key for touch devices, which have no
           keyboard. Hidden on desktop (CSS); shown on mobile, where the bar wraps
           the seek track down to its own row. -->
      <button class="ab-skip" id="ln-back" type="button" aria-label="Back 5 seconds" title="Back 5s" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><text x="12" y="15.6" text-anchor="middle" font-size="9" font-weight="700" stroke="none" fill="currentColor">5</text></svg>
      </button>
      <button class="ab-play" id="ln-play" type="button" aria-label="Play" disabled>
        <svg class="ab-ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16a1 1 0 0 0 1.55.85l12.5-8a1 1 0 0 0 0-1.7l-12.5-8A1 1 0 0 0 7 4z" fill="currentColor"/></svg>
        <svg class="ab-ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.4" y="3.5" width="4.2" height="17" rx="1.7" fill="currentColor"/><rect x="13.4" y="3.5" width="4.2" height="17" rx="1.7" fill="currentColor"/></svg>
      </button>
      <!-- Jump forward 5s. Mirrors the → arrow key (see #ln-back). -->
      <button class="ab-skip" id="ln-fwd" type="button" aria-label="Forward 5 seconds" title="Forward 5s" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/><text x="12" y="15.6" text-anchor="middle" font-size="9" font-weight="700" stroke="none" fill="currentColor">5</text></svg>
      </button>
      <!-- Hide the whole player (mobile only). Sits with the transport controls;
           tapping it collapses the player down to the floating broadcast button
           (#ln-fab), which brings it back. Hidden on desktop (CSS). -->
      <button class="ab-collapse" id="ln-collapse" type="button" aria-label="Hide player" title="Hide player" aria-controls="ln-player" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <!-- Seek track + time. Wrapped so the pair can drop to a second row on
           mobile as one unit (see the audiobar wrap rule) while staying inline on
           desktop. -->
      <div class="ab-progress">
        <div class="ab-track" id="ln-track"><div class="ab-fill" id="ln-fill"></div></div>
        <span class="ab-time" id="ln-time">0:00 / 0:00</span>
      </div>
      <audio id="ln-audio"></audio>
    </div>
  </div>

  <!-- Floating "show player" button (mobile only). When the player is collapsed
       (body.player-collapsed) this broadcast icon floats at the bottom-right —
       styled like the record button — and tapping it brings the whole player
       (caption · controls · seek) back. Hidden on desktop and whenever the
       player is open (CSS). -->
  <button class="ln-fab" id="ln-fab" type="button" aria-label="Show player" title="Show player" aria-controls="ln-player" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/>
      <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/>
      <circle cx="12" cy="12" r="2"/>
      <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/>
      <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>
    </svg>
  </button>

<!-- Electron shell only, unrelated to comart's page: wires up the custom
     title bar above on Linux/Windows. Runs before app-base.js/app-listen.js
     on purpose, though order doesn't matter to either side. -->
<script src="titlebar.js"></script>

<!-- Cloned from comart's app.html (the Listen/audio-playback feature only —
     Exscriptor's mic button, modal and CSS were originally removed, cleanly:
     app-listen.js never depended on them). app-listen.js itself is untouched,
     line for line. app-base.js FIRST: it is the one file here that is not
     [A]'s, and app-listen.js reads it. -->
<script src="app-base.js"></script>
<script src="app-listen.js"></script>
<!-- The floating microphone button, restored from comart's mic.js — see its
      own header for what changed in the port. Loaded last and depends only on
      app-base.js's apiBase(); app-listen.js is untouched by its presence. -->
<script src="mic.js"></script>
<!-- Daily Dictation — audio-only 1–2 sentence loops from PBS NewsHour,
     with a WER-based checker. See backend/dictation.js for the scoring
     definition; this file owns the notepad UI and its loop. -->
<script src="app-dictation.js"></script>
</body>
</html>
