name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          for f in main.js preload.js titlebar.js app-base.js app-player.js app-dictation.js mic.js backend/*.js; do
            node --check "$f" || exit 1
          done
          echo "All JS files parse."
